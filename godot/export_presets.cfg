; Presets de exportación para Godot 4.7.2
; Configurado para generar archivos .apk compatibles con distribución en Uptodown o tiendas de terceros.
; Incluye soporte explícito para arquitecturas móviles ARM de 32 bits (armeabi-v7a) y 64 bits (arm64-v8a).

[preset.0]

name="Android APK (Uptodown / Terceros)"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/android/ecos_en_la_penumbra.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/use_custom_build=false
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/compress_native_libraries=false
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.umbraestudio.ecosenlapenumbra"
package/name="Ecos en la Penumbra"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/vibrate=true
permissions/wake_lock=true
command_line/extra_args=""
