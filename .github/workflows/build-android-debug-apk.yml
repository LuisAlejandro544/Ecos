# Workflow manual de GitHub Actions para compilar el APK Debug con Godot 4.7.2
# Se activa ÚNICAMENTE de forma manual desde la pestaña Actions (workflow_dispatch).
name: Compilar APK Debug (Godot 4.7.2)

on:
  workflow_dispatch:

jobs:
  build-android-debug-apk:
    name: Compilar APK Debug Android
    runs-on: ubuntu-latest

    env:
      GODOT_RELEASE_TAG: "4.7.2-stable"
      GODOT_TEMPLATE_DIR_NAME: "4.7.2.stable"
      EXPORT_PRESET_NAME: "Android APK (Uptodown / Terceros)"
      OUTPUT_APK_REL: "builds/android/ecos_en_la_penumbra-debug.apk"

    steps:
      - name: Descargar todo el código del proyecto
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK y Build-Tools
        uses: android-actions/setup-android@v3

      - name: Instalar platform-tools y build-tools para firmar el APK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Descargar Godot 4.7.2-stable y plantillas de exportación
        run: |
          mkdir -p /tmp/godot-dl
          cd /tmp/godot-dl

          curl --fail --location --retry 3 --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_RELEASE_TAG}_linux.x86_64"
          sudo mv "Godot_v${GODOT_RELEASE_TAG}_linux.x86_64" /usr/local/bin/godot

          curl --fail --location --retry 3 --output templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_RELEASE_TAG}_export_templates.tpz"
          unzip -q templates.tpz

          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR_NAME}"
          mkdir -p "$TEMPLATE_DEST"
          if [ -d "templates" ]; then
            mv templates/* "$TEMPLATE_DEST/"
          else
            mv *templates*/* "$TEMPLATE_DEST/"
          fi

          godot --version
          ls -lh "$TEMPLATE_DEST"

      - name: Generar debug.keystore y configurar rutas de Android en Godot
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          for SETTINGS_FILE in \
            "$HOME/.config/godot/editor_settings-4.7.tres" \
            "$HOME/.config/godot/editor_settings-4.tres"; do
            printf '%s\n' \
              '[gd_resource type="EditorSettings" format=3]' \
              '' \
              '[resource]' \
              "export/android/java_sdk_path = \"${JAVA_HOME}\"" \
              "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
              "export/android/debug_keystore = \"${HOME}/.android/debug.keystore\"" \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' \
              > "$SETTINGS_FILE"
          done

      - name: Importar recursos del proyecto (.glb, escenas, texturas)
        run: |
          godot --headless --path godot --import

      - name: Compilar APK Debug con Godot 4.7.2
        run: |
          mkdir -p godot/builds/android
          godot --headless --verbose --path godot --export-debug "${EXPORT_PRESET_NAME}" "${OUTPUT_APK_REL}"
          test -s "godot/${OUTPUT_APK_REL}"
          ls -lh "godot/${OUTPUT_APK_REL}"

      - name: Subir APK Debug como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: ecos-en-la-penumbra-debug-apk
          path: godot/${{ env.OUTPUT_APK_REL }}
          if-no-files-found: error
          retention-days: 14
